<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#080a0f"/>
  <rect width="512" height="512" rx="100" fill="url(#grad)" opacity="0.15"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#e8c97a"/>
    </linearGradient>
  </defs>
  <!-- Scale of justice -->
  <rect x="248" y="120" width="16" height="200" rx="8" fill="#c9a84c"/>
  <rect x="160" y="128" width="192" height="12" rx="6" fill="#c9a84c"/>
  <!-- Left pan -->
  <line x1="176" y1="140" x2="196" y2="220" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="196" cy="235" rx="44" ry="16" fill="none" stroke="#c9a84c" stroke-width="8"/>
  <!-- Right pan -->
  <line x1="336" y1="140" x2="316" y2="220" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="316" cy="235" rx="44" ry="16" fill="none" stroke="#c9a84c" stroke-width="8"/>
  <!-- Base -->
  <rect x="220" y="316" width="72" height="12" rx="6" fill="#c9a84c"/>
  <!-- P letter -->
  <text x="256" y="410" font-family="Arial" font-size="72" font-weight="900" fill="#c9a84c" text-anchor="middle">پرواز</text>
</svg>
